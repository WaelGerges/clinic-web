# Include/adapt inside the future HTTPS server block.
# Serve only dist, never the source repository.
root /srv/clinic-web/dist;
index index.html;
server_tokens off;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://geikkygtnsgbtajyqdvc.supabase.co wss://geikkygtnsgbtajyqdvc.supabase.co; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
# Enable HSTS after HTTPS and the domain configuration are verified:
# add_header Strict-Transport-Security "max-age=31536000" always;

location / {
    try_files $uri $uri/ /index.html;
}
# Auth redirects and the entry document must not be cached by intermediaries.
location = /index.html {
    expires -1;
}
# These filenames contain build hashes.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}
location ~ /\. {
    deny all;
}
